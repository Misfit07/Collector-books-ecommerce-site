<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880" width="100%" height="100%">
  <defs>
    <radialGradient id="leatherGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#2c4c3b" />
      <stop offset="50%" stop-color="#1b3327" />
      <stop offset="100%" stop-color="#0e1d16" />
    </radialGradient>
    <linearGradient id="goldGilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd691" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#aa8018" />
      <stop offset="75%" stop-color="#f5e1a4" />
      <stop offset="100%" stop-color="#997314" />
    </linearGradient>
    <filter id="emboss">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Book Cloth Base -->
  <rect width="600" height="880" rx="10" fill="url(#leatherGrad)" />
  
  <!-- Spine hinge shadow on left -->
  <rect x="0" y="0" width="36" height="880" rx="4" fill="#000" opacity="0.25" />
  <line x1="36" y1="0" x2="36" y2="880" stroke="#000" stroke-width="2" opacity="0.4" />
  <line x1="38" y1="0" x2="38" y2="880" stroke="url(#goldGilt)" stroke-width="0.75" opacity="0.3" />

  <!-- Outer Ornate Gilt Frame -->
  <rect x="52" y="28" width="516" height="824" rx="4" fill="none" stroke="url(#goldGilt)" stroke-width="2" filter="url(#emboss)" />
  <rect x="60" y="36" width="500" height="808" rx="2" fill="none" stroke="url(#goldGilt)" stroke-width="0.75" opacity="0.8" />
  
  <!-- Corner Ornaments -->
  <g stroke="url(#goldGilt)" stroke-width="1.5" fill="none">
    <path d="M 68 56 L 68 44 L 80 44 M 68 44 L 84 60" />
    <path d="M 552 56 L 552 44 L 540 44 M 552 44 L 536 60" />
    <path d="M 68 824 L 68 836 L 80 836 M 68 836 L 84 820" />
    <path d="M 552 824 L 552 836 L 540 836 M 552 836 L 536 820" />
  </g>

  <!-- Center Decorative Cartouche -->
  <circle cx="310" cy="180" r="48" fill="none" stroke="url(#goldGilt)" stroke-width="1.5" />
  <path d="M 310 142 L 310 218 M 272 180 L 348 180" stroke="url(#goldGilt)" stroke-width="0.75" opacity="0.5" />

  <!-- Title & Author in Classical Gilt -->
  <g text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" filter="url(#emboss)">
    <text x="310" y="330" font-size="34" font-weight="700" fill="url(#goldGilt)" letter-spacing="2">THE HOBBIT</text>
    <text x="310" y="368" font-size="14" font-style="italic" fill="#e8d8b5" letter-spacing="3">OR THERE AND BACK AGAIN</text>
    
    <line x1="210" y1="400" x2="410" y2="400" stroke="url(#goldGilt)" stroke-width="1" />
    <circle cx="310" cy="400" r="3" fill="url(#goldGilt)" />

    <text x="310" y="460" font-size="20" font-weight="600" fill="url(#goldGilt)" letter-spacing="4">J. R. R. TOLKIEN</text>
  </g>

  <!-- Central Emblem / Illustration placeholder -->
  <g transform="translate(190, 510)" stroke="url(#goldGilt)" fill="none" stroke-width="1.2">
    <!-- Mountain and Dragon Silhouette Motif -->
    <path d="M 20 120 L 70 40 L 120 100 L 160 30 L 220 120 Z" />
    <circle cx="180" cy="35" r="8" fill="url(#goldGilt)" opacity="0.6" />
    <path d="M 60 70 Q 120 85 180 65" stroke-dasharray="2 3" opacity="0.5" />
  </g>

  <!-- Foot Imprint -->
  <g text-anchor="middle" font-family="Georgia, serif" fill="url(#goldGilt)" opacity="0.9">
    <text x="310" y="740" font-size="11" letter-spacing="3">GEORGE ALLEN &amp; UNWIN LTD</text>
    <text x="310" y="760" font-size="10" font-family="monospace" letter-spacing="2">LONDON • 1937</text>
  </g>
</svg>
