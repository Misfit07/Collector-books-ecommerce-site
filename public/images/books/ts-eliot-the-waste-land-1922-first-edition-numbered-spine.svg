<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 880" width="100%" height="100%">
  <defs>
    <linearGradient id="spineBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="25%" stop-color="#1a2e35" />
      <stop offset="70%" stop-color="#0d181c" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="goldSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6a8" />
      <stop offset="50%" stop-color="#d1ab45" />
      <stop offset="100%" stop-color="#8a6714" />
    </linearGradient>
  </defs>

  <rect width="200" height="880" fill="url(#spineBg)" />
  
  <g transform="translate(0, 80)">
    <rect x="0" y="0" width="200" height="10" fill="#000" opacity="0.4" />
    <line x1="0" y1="2" x2="200" y2="2" stroke="url(#goldSpine)" stroke-width="1.5" />
    <line x1="0" y1="8" x2="200" y2="8" stroke="url(#goldSpine)" stroke-width="0.75" opacity="0.6" />
  </g>
  <g transform="translate(0, 220)">
    <rect x="0" y="0" width="200" height="10" fill="#000" opacity="0.4" />
    <line x1="0" y1="2" x2="200" y2="2" stroke="url(#goldSpine)" stroke-width="1.5" />
    <line x1="0" y1="8" x2="200" y2="8" stroke="url(#goldSpine)" stroke-width="0.75" opacity="0.6" />
  </g>
  <g transform="translate(0, 380)">
    <rect x="0" y="0" width="200" height="10" fill="#000" opacity="0.4" />
    <line x1="0" y1="2" x2="200" y2="2" stroke="url(#goldSpine)" stroke-width="1.5" />
    <line x1="0" y1="8" x2="200" y2="8" stroke="url(#goldSpine)" stroke-width="0.75" opacity="0.6" />
  </g>
  <g transform="translate(0, 540)">
    <rect x="0" y="0" width="200" height="10" fill="#000" opacity="0.4" />
    <line x1="0" y1="2" x2="200" y2="2" stroke="url(#goldSpine)" stroke-width="1.5" />
    <line x1="0" y1="8" x2="200" y2="8" stroke="url(#goldSpine)" stroke-width="0.75" opacity="0.6" />
  </g>
  <g transform="translate(0, 700)">
    <rect x="0" y="0" width="200" height="10" fill="#000" opacity="0.4" />
    <line x1="0" y1="2" x2="200" y2="2" stroke="url(#goldSpine)" stroke-width="1.5" />
    <line x1="0" y1="8" x2="200" y2="8" stroke="url(#goldSpine)" stroke-width="0.75" opacity="0.6" />
  </g>

  <g transform="translate(100, 300) rotate(90)" text-anchor="middle" font-family="'Playfair Display', Georgia, serif">
    <text x="0" y="-8" font-size="16" font-weight="700" fill="url(#goldSpine)" letter-spacing="2">
      THE WASTE LAND
    </text>
    <text x="0" y="16" font-size="12" fill="#e8f2f5" letter-spacing="1">
      T.S. Eliot
    </text>
  </g>

  <text x="100" y="770" text-anchor="middle" font-family="monospace" font-size="13" fill="url(#goldSpine)" font-weight="bold" letter-spacing="2">
    1922
  </text>
</svg>